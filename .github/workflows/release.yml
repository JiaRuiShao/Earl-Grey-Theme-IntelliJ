name: Release

# Builds the plugin, attaches it to a GitHub release and uploads it to JetBrains Marketplace
# (plugin 32608, "Earl Grey UI Theme").
#
# Run it from the Actions tab (Release > Run workflow > version), or push a tag such as v1.2.0.
# The Marketplace upload needs a repository secret JETBRAINS_MARKETPLACE_TOKEN holding a permanent token
# from https://plugins.jetbrains.com/author/me/tokens; without it the run still publishes the GitHub release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, higher than the last Marketplace version (e.g. 1.2.0)
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      INPUT_VERSION: ${{ github.event.inputs.version }}
      MARKETPLACE_PLUGIN_ID: '32608'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve version
        id: version
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.0, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "jar=build/EarlGreyTheme-$version.jar" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: tools/build-plugin.sh "${{ steps.version.outputs.version }}"

      - name: Validate plugin
        run: python3 tools/validate-plugin.py "${{ steps.version.outputs.jar }}" "${{ steps.version.outputs.version }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          JAR: ${{ steps.version.outputs.jar }}
        run: |
          python3 - "$JAR" > notes.html <<'EOF'
          import re, sys, zipfile
          xml = zipfile.ZipFile(sys.argv[1]).read("META-INF/plugin.xml").decode()
          print(re.search(r"<change-notes><!\[CDATA\[(.*?)\]\]></change-notes>", xml, re.S).group(1).strip())
          EOF
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$JAR" --clobber
          else
            gh release create "v$VERSION" "$JAR" --target "$GITHUB_SHA" --title "Earl Grey UI Theme $VERSION" --notes-file notes.html
          fi

      - name: Upload to JetBrains Marketplace
        env:
          MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          JAR: ${{ steps.version.outputs.jar }}
        run: |
          if [ -z "$MARKETPLACE_TOKEN" ]; then
            echo "::warning::JETBRAINS_MARKETPLACE_TOKEN is not set, so the Marketplace upload was skipped. Add the secret and re-run this workflow, or upload $JAR from the GitHub release by hand."
            exit 0
          fi
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $MARKETPLACE_TOKEN" \
            -F "pluginId=$MARKETPLACE_PLUGIN_ID" \
            -F "file=@$JAR" \
            https://plugins.jetbrains.com/plugin/uploadPlugin
          echo
          echo "Uploaded $JAR to https://plugins.jetbrains.com/plugin/$MARKETPLACE_PLUGIN_ID (JetBrains reviews updates before they go live)."
